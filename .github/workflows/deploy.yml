name: CI/CD Docker + VPS Deploy

on:
  push:
    branches: ["prod"]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # gradlew nằm trong BE/
      - name: Grant execute permission for gradlew
        working-directory: BE
        run: chmod +x gradlew

      - name: Build JAR (Gradle)
        working-directory: BE
        run: ./gradlew clean bootJar -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dockerfile ở ROOT nên context = .
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nguyenduoc/datn-be:latest
            nguyenduoc/datn-be:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"

            # Update TAG in .env (create if missing)
            if [ -f .env ]; then
              if grep -q '^TAG=' .env; then
                sed -i "s/^TAG=.*/TAG=${{ github.sha }}/" .env
              else
                echo "TAG=${{ github.sha }}" >> .env
              fi
            else
              echo "TAG=${{ github.sha }}" > .env
            fi

            docker compose pull be
            docker compose up -d be
            docker image prune -f