spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**,/oauth2/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/admin/khach-hang/**,/api/v1/admin/nhan-vien/**,/api/v1/permitall/profile/**
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/admin/mau-sac/**,/api/v1/admin/size/**,/api/v1/admin/thuong-hieu/**,/api/v1/admin/xuat-xu/**,/api/v1/admin/san-pham/**,/api/v1/admin/san-pham-chi-tiet/**,/api/v1/admin/chat-lieu/**,/api/v1/admin/danh-muc/**,/api/v1/admin/loai-de/**,/api/v1/admin/categories/**,/api/v1/admin/product-attributes/**,/api/v1/admin/product-variant-axes/**,/api/v1/permitall/san-pham/**,/api/v1/permitall/san-pham-chi-tiet/**,/api/v1/permitall/thuong-hieu/**,/api/v1/permitall/products/**,/api/v1/permitall/categories/**,/api/catalog/user/products/**,/api/v1/seller/products/**,/api/v1/seller/product-variants/**
        - id: promotion-service
          uri: lb://promotion-service
          predicates:
            - Path=/api/v1/admin/dot-giam-gia/**,/api/v1/admin/voucher/**,/api/v1/seller/vouchers/**,/api/v1/seller/promotions/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/admin/thong-ke/**,/api/v1/admin/disputes/**,/api/v1/permitall/don-mua/**,/api/orders/**,/api/v1/seller/orders/**,/api/v1/seller/disputes/**,/api/v1/buyer/disputes/**
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/v1/permitall/cart/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: payout-service
          uri: lb://payout-service
          predicates:
            - Path=/api/v1/admin/payout/**,/api/v1/seller/payout/**
        - id: seller-service
          uri: lb://seller-service
          predicates:
            - Path=/api/v1/sellers/**,/api/v1/seller/**,/api/v1/buyer/reports/**,/api/v1/buyer/chat/**,/api/v1/admin/sellers/**,/api/v1/admin/banners/**,/api/v1/admin/reports/**,/api/v1/permitall/shops/**,/api/v1/permitall/banners/**,/api/v1/permitall/reviews/**

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
jwt:
  secret: ${JWT_SECRET:microservice-auth-secret-key-please-change-in-env-123456789}

