plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'com.ecommerce.microservice'
version = '0.0.1-SNAPSHOT'

ext {
    springBootVersion = '3.4.4'
    springCloudVersion = '2024.0.1'
}

def localBackendModules = [
        'discovery-server',
        'auth-service',
        'user-service',
        'catalog-service',
        'promotion-service',
        'cart-service',
        'order-service',
        'seller-service',
        'payout-service',
        'api-gateway',
        'notification-service'
]

tasks.register('startLocalBackend', Exec) {
    group = 'local development'
    description = 'Builds and starts the complete local backend in dependency order.'
    dependsOn localBackendModules.collect { ":${it}:bootJar" }
    workingDir rootDir.parentFile
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('start-backend.ps1').absolutePath, '-SkipBuild'
}

tasks.register('stopLocalBackend', Exec) {
    group = 'local development'
    description = 'Stops all Java services started by the local backend runner.'
    workingDir rootDir.parentFile
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('stop-all.ps1').absolutePath
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.ext.springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${rootProject.ext.springCloudVersion}"
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    plugins.withId('org.springframework.boot') {
        dependencies {
            implementation 'org.springframework.boot:spring-boot-starter-actuator'
            implementation 'io.micrometer:micrometer-registry-prometheus'
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // Gradle bootRun and IntelliJ's delegated "main()" tasks are local
    // development entry points. Give them the local profile by default so a
    // developer can Run/Debug any service directly. Explicit CLI arguments,
    // JVM properties, or environment variables still override this default.
    tasks.withType(JavaExec).configureEach {
        if (!System.getenv('SPRING_PROFILES_ACTIVE') &&
                !System.getProperty('spring.profiles.active')) {
            systemProperty 'spring.profiles.active', 'local'
        }
    }
}

