spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_catalog}
    username: ${CATALOG_DATASOURCE_USERNAME:root}
    password: ${CATALOG_DATASOURCE_PASSWORD:12345678}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
    show-sql: ${JPA_SHOW_SQL:false}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: ${ELASTICSEARCH_CONNECTION_TIMEOUT:1s}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:5s}
    socket-keep-alive: true
  data:
    elasticsearch:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8083}

catalog:
  search:
    elasticsearch:
      index: ${CATALOG_SEARCH_INDEX:products}
      cursor:
        signing-key: ${CATALOG_SEARCH_CURSOR_SIGNING_KEY:local-dev-cursor-signing-key-change-me}
      pit:
        keep-alive: ${CATALOG_SEARCH_PIT_KEEP_ALIVE:2m}
        cursor-max-age-millis: ${CATALOG_SEARCH_PIT_CURSOR_MAX_AGE_MILLIS:120000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

management:
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "http.server.requests": true
        "catalog.search.elasticsearch.latency": true
      slo:
        "catalog.search.elasticsearch.latency": 50ms,100ms,250ms,500ms,1s
