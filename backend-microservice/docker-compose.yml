services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    depends_on:
      - discovery-server
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
    ports:
      - "8080:8080"

  auth-service:
    build: ./auth-service
    depends_on:
      - mysql
      - discovery-server
    environment:
      AUTH_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      AUTH_DATASOURCE_USERNAME: root
      AUTH_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  user-service:
    build: ./user-service
    depends_on:
      - mysql
      - discovery-server
    environment:
      USER_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      USER_DATASOURCE_USERNAME: root
      USER_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  catalog-service:
    build: ./catalog-service
    depends_on:
      - mysql
      - discovery-server
    environment:
      CATALOG_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      CATALOG_DATASOURCE_USERNAME: root
      CATALOG_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  promotion-service:
    build: ./promotion-service
    depends_on:
      - mysql
      - discovery-server
    environment:
      PROMOTION_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_promotion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      PROMOTION_DATASOURCE_USERNAME: root
      PROMOTION_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  cart-service:
    build: ./cart-service
    depends_on:
      - mysql
      - discovery-server
    environment:
      CART_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_cart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      CART_DATASOURCE_USERNAME: root
      CART_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  order-service:
    build: ./order-service
    depends_on:
      - mysql
      - kafka
      - discovery-server
    environment:
      ORDER_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      ORDER_DATASOURCE_USERNAME: root
      ORDER_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  inventory-service:
    build: ./inventory-service
    depends_on:
      - mysql
      - kafka
      - discovery-server
    environment:
      INVENTORY_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_inventory?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      INVENTORY_DATASOURCE_USERNAME: root
      INVENTORY_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  notification-service:
    build: ./notification-service
    depends_on:
      - kafka
      - discovery-server
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

volumes:
  mysql-data:
