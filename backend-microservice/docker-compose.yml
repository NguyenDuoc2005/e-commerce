services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1001
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  kafka-connect:
    build: ./kafka-connect
    depends_on:
      - kafka
      - mysql
      - elasticsearch
    ports:
      - "8084:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: ecommerce-connect
      CONNECT_CONFIG_STORAGE_TOPIC: ecommerce-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: ecommerce-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: ecommerce-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO

  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    depends_on:
      - discovery-server
    environment:
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
    ports:
      - "8080:8080"

  auth-service:
    build: ./auth-service
    depends_on:
      - mysql
      - discovery-server
    environment:
      AUTH_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      AUTH_DATASOURCE_USERNAME: root
      AUTH_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  user-service:
    build: ./user-service
    depends_on:
      - mysql
      - discovery-server
    environment:
      USER_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      USER_DATASOURCE_USERNAME: root
      USER_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  catalog-service:
    build: ./catalog-service
    depends_on:
      - mysql
      - elasticsearch
      - discovery-server
    environment:
      CATALOG_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      CATALOG_DATASOURCE_USERNAME: root
      CATALOG_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  promotion-service:
    build: ./promotion-service
    depends_on:
      - mysql
      - discovery-server
    environment:
      PROMOTION_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_promotion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      PROMOTION_DATASOURCE_USERNAME: root
      PROMOTION_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  cart-service:
    build: ./cart-service
    depends_on:
      - mysql
      - discovery-server
    environment:
      CART_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_cart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      CART_DATASOURCE_USERNAME: root
      CART_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  order-service:
    build: ./order-service
    depends_on:
      - mysql
      - kafka
      - discovery-server
    environment:
      ORDER_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      ORDER_DATASOURCE_USERNAME: root
      ORDER_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345678}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

  notification-service:
    build: ./notification-service
    depends_on:
      - kafka
      - discovery-server
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

volumes:
  mysql-data:
  kafka-data:
  elasticsearch-data:
