spring:
  application:
    name: payout-service
  datasource:
    url: ${PAYOUT_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_payout}
    username: ${PAYOUT_DATASOURCE_USERNAME:root}
    password: ${PAYOUT_DATASOURCE_PASSWORD:12345678}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        globally_quoted_identifiers: true
    show-sql: ${JPA_SHOW_SQL:false}

server:
  port: ${SERVER_PORT:8091}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
