spring:
  application:
    name: payout-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payout-service-order-events
      auto-offset-reset: earliest
  datasource:
    url: ${PAYOUT_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_payout}
    username: ${PAYOUT_DATASOURCE_USERNAME:root}
    password: ${PAYOUT_DATASOURCE_PASSWORD:12345678}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        globally_quoted_identifiers: true
    show-sql: ${JPA_SHOW_SQL:false}

server:
  port: ${SERVER_PORT:8091}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}

payout:
  settlement-hold-days: ${PAYOUT_SETTLEMENT_HOLD_DAYS:7}
  release-cron: ${PAYOUT_RELEASE_CRON:0 0 * * * *}
  dlt:
    reconciliation-delay-ms: ${PAYOUT_DLT_RECONCILIATION_DELAY_MS:60000}
    reconciliation-group: ${PAYOUT_DLT_RECONCILIATION_GROUP:payout-service-dlt-reconciliation}
