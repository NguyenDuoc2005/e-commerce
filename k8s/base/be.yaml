apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-be
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-be
  template:
    metadata:
      labels:
        app: ecommerce-be
    spec:
      initContainers:
        - name: wait-for-mysql
          image: alpine
          command:
            - sh
            - -c
            - |
              apk add --no-cache netcat-openbsd;
              until nc -z dev-mysql 3306; do
                echo "waiting for mysql...";
                sleep 2;
              done;
              echo "MySQL is ready!";

      containers:
        - name: be
          image: nguyenduoc/datn-be:20260130-01
          imagePullPolicy: Never
          ports:
            - containerPort: 8386
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://dev-mysql:3306/ecommerce?useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "ecommerce"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "12345678"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.MySQL8Dialect"
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: MYSQL_HOST
              value: "dev-mysql"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: "ecommerce"
            - name: MYSQL_USER
              value: "ecommerce"
            - name: MYSQL_PASSWORD
              value: "12345678"
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: SERVER_PORT
              value: "8386"
            - name: SERVER_VERSION
              value: "1.0.0"
            - name: ALLOWED_ORIGIN
              value: "http://localhost:6688"
            - name: FRONTEND_URL
              value: "http://localhost:6688"
            - name: GENERATE_DB
              value: "false"
            - name: USER_EMAIL
              value: "admin@gmail.com"
            - name: USER_CODE
              value: "PH50257"
            - name: USER_NAME
              value: "NGUYEN VAN A"
            - name: USER_PHONE
              value: "0385423035"
            - name: ROLE
              value: "ADMIN"
            - name: JWT_SECRET
              value: "dGV5cjgzNWlsNWhjYXl1d2hsYXpkaGZ5dmxhd3NkbXlrZmdhbW84cThyNmhxOG01c2RscGQ3M2VrdG1uYnFnZWtybjVwYzEzNGs4Zjc5dmlqbGJrYjh2OHdyYnEyc3BsOWUxbnkwbzh4dmtjano1dmpjYWFxM3UybGFrcWg5czM="
            - name: GOOGLE_CLIENT_ID
              value: "872404753146-3laab91qjrrgnt4lc8i0pha0ol9g52g3.apps.googleusercontent.com"
            - name: GOOGLE_CLIENT_SECRET
              value: "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"
